name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/finapp.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/finapp.keystore" >> "$GITHUB_ENV"
          else
            echo "Segredo KEYSTORE_BASE64 ausente: usando a chave debug padrao."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finapp-listener
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publicar release (o app consulta isto para se atualizar)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk finapp-listener.apk
          gh release create "v${{ github.run_number }}" finapp-listener.apk \
            --title "FinApp Listener 1.${{ github.run_number }}" \
            --notes "Build automatico #${{ github.run_number }}" \
            --latest
